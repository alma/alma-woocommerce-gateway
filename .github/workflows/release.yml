# When a release PR synced from the private repository is merged, pins the
# release the private repository drafted with the plugin zip to the merge commit.
# The draft is published by hand, once its zip is tested.
name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions: {}

jobs:

  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-26.04

    permissions:
      contents: write # Edit the draft release

    steps:
      # The tag is only created at publish time: pin it to the merge commit,
      # so it matches the zip even if main moves before publication
      - name: Pin the drafted release to the merge commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          tag="${PR_HEAD_REF#release/}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET"

