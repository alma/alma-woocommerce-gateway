# When a release PR synced from the private repository is merged, publishes
# the release the private repository drafted with the plugin zip.
name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions: {}

jobs:

  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-26.04

    permissions:
      contents: write # Publish the release and create its tag

    steps:
      # The tag goes on the merge commit
      - name: Publish the drafted release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          tag="${PR_HEAD_REF#release/}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --draft=false \
            --latest

